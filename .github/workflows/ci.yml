name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install DVC with S3 support
        run: pip install dvc dvc-s3

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/ tests/ --max-line-length=100 --ignore=E501,W503,E221,E241,W292,F401,F541,E302,F811

      - name: Pull model artifacts from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          dvc remote modify --local myremote access_key_id $AWS_ACCESS_KEY_ID
          dvc remote modify --local myremote secret_access_key $AWS_SECRET_ACCESS_KEY
          dvc pull

      - name: Run pipeline tests
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: python -m pytest tests/test_pipeline.py -v

      - name: Run API tests
        run: python -m pytest tests/test_api.py -v

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull model artifacts from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          pip install dvc dvc-s3
          dvc remote modify --local myremote access_key_id $AWS_ACCESS_KEY_ID
          dvc remote modify --local myremote secret_access_key $AWS_SECRET_ACCESS_KEY
          dvc pull

      - name: Build Docker image
        run: docker build -t churn-predictor .

      - name: Test Docker container health
        run: |
          docker run -d -p 8000:8000 --name test-api churn-predictor
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker stop test-api

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -d '{}'
