version: "3.9"

services:
  api:
    build: .
    ports:
      # Host 8000, not 5001, since 5001 is already used locally by
      # MLflow (5000 is blocked by AirPlay on macOS).
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s